services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_DEBUG: "1"
      ALLOWED_HOSTS: localhost,127.0.0.1,[::1]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 3s
      timeout: 5s
      retries: 10
name: primal-infrastructure
services:
  backend:
    image: primal-infrastructure-backend:local
    build:
      context: ./backend
      target: development
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    volumes:
      - type: bind
        source: .
        target: /workspace
    environment:
      PYTHONPATH: /workspace
      UV_CACHE_DIR: /tmp/uv-cache
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    networks: [tooling]
networks:
  tooling:
    driver: bridge
