name: Application checks
on:
  pull_request:
  push:
    branches: [main, feature/scanner-mvp]
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.8
      - run: sh scripts/check-backend.sh
      - name: Container build and HTTP smoke
        run: |
          docker compose up --build -d --wait
          python scripts/smoke-api.py
      - if: always()
        run: docker compose down --remove-orphans
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.8
      - run: sh scripts/check-ios.sh
