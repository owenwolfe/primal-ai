[project]
name = "primal-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["django>=5.2,<5.3", "gunicorn>=27,<28"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.9,<5", "pytest-cov>=6,<8", "ruff>=0.11,<1", "jsonschema>=4.23,<5"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "primal.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
