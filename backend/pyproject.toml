[project]
name = "primal-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["django>=5.2,<5.3", "gunicorn>=27,<28"]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-django>=4.9,<5", "pytest-cov>=6,<8", "ruff>=0.11,<1", "jsonschema>=4.23,<5"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "primal.settings"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
version = "0.0.0"
description = "Development infrastructure for the planned Primal iPhone backend"
requires-python = ">=3.14,<3.15"
dependencies = ["django>=5.2,<5.3", "gunicorn>=23"]

[dependency-groups]
dev = [
  "coverage[toml]>=7.6", "django-stubs>=5.2,<5.3", "mypy>=1.15",
  "pip-audit>=2.9", "pytest>=8", "pytest-cov>=6", "pytest-django>=4.10",
  "pyyaml>=6", "ruff>=0.11", "types-pyyaml>=6",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 100
cache-dir = "/tmp/primal-ruff"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90", "S"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"**/scripts/**" = ["S603", "S607"]

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
files = ["../scripts", "../tests/infrastructure"]

[tool.pytest.ini_options]
testpaths = ["../tests/infrastructure"]
addopts = "--strict-config --strict-markers -ra"
cache_dir = "/tmp/primal-pytest-cache"
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["scripts"]
relative_files = true
data_file = "reports/.coverage"

[tool.coverage.report]
show_missing = true
precision = 2

[tool.coverage.json]
output = "reports/coverage.json"

[tool.coverage.xml]
output = "reports/coverage.xml"
